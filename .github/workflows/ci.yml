name: CI - Verificación de Pipeline ETL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Validar Sintaxis y Ejecución ETL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificación de sintaxis de scripts Python
        run: |
          python -m py_compile app.py
          python -m py_compile scripts/etl_maestro.py
          python -m py_compile scripts/generar_reporte_auditoria.py

      - name: Prueba de ejecución del Pipeline ETL
        run: |
          python scripts/etl_maestro.py
